name: Test 1Password OIDC Integration

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GitHub to issue the OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          unset-previous-variables: 'true'
        env:
          OP_WORKLOAD_ID: ${{ secrets.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}
          # Replace with your actual vault and secret reference path
          TEST_SECRET: 'op://<vault-name-or-id>/<item-name-or-id>/<field-name>'

      - name: Verify secret retrieval
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "Secret loaded successfully."
          else
            echo "Failed to load secret."
            exit 1
          fi
