name: Test 1Password OIDC Integration

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GitHub to issue the OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_WORKLOAD_ID: ${{ secrets.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Verify Environment Variable
        run: |
          if [ -n "$MY_VARIABLE" ]; then
            echo "MY_VARIABLE was loaded successfully from 1Password Environment."
          else
            echo "MY_VARIABLE is empty or missing."
            exit 1
          fi
